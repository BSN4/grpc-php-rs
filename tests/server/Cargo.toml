[package]
name = "grpc-test-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
bytes = "1"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
