name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check
        run: cargo check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: cargo test
        run: cargo test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run core suites
        run: ./test.sh all

  zts-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ZTS stress test (FrankenPHP, 200 concurrent gRPC+TLS requests)
        run: ./test.sh zts
